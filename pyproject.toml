[project]
name = "gridcast"
version = "0.1.0"
description = "Live day-ahead electricity demand forecaster for the California ISO"
readme = "README.md"
authors = [
    { name = "A5bhinav", email = "abhinavjinka@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.2.1",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
notebooks = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]  # EDA only; nothing in the pipeline imports them

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
