# Local development database. Production runs on Supabase Postgres.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gridcast
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gridcast"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
