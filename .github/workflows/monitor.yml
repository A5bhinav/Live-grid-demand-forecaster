name: monitor

on:
  schedule:
    - cron: "7 19 * * *" # 12:07 PDT / 11:07 PST, after the 11:00 Pacific forecast deadline
    - cron: "7 23 * * *" # a second look, in case the first run is dropped
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      # Fails, and so triggers GitHub's failure email, when any check does not pass.
      - run: uv run --no-sync python -m gridcast.jobs.monitor
