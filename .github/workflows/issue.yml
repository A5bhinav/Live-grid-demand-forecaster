name: issue

on:
  schedule:
    - cron: "23 16 * * *" # 09:23 PDT / 08:23 PST, before 10:00 Pacific all year
  workflow_dispatch:

concurrency:
  group: issue
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      # The active model's artifact is read from Supabase Storage.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      # Refresh inputs first. If the source is down, forecast from what the last
      # scheduled ingest loaded rather than miss the day.
      - run: uv run --no-sync python -m gridcast.jobs.ingest
        continue-on-error: true
      - run: uv run --no-sync python -m gridcast.jobs.issue
      - if: failure()
        run: >-
          uv run --no-sync python -m gridcast.alerts
          "${{ github.workflow }} workflow failed:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
